<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>KURSOR — школа программирования</title>
<meta name="description" content="Диагностика, видео-презентация и колесо фортуны школы программирования Kursor">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/brand.css">
<style>
  .wrap{width:100%;max-width:520px;margin:0 auto;padding:8px 18px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
  .lead{text-align:center;color:var(--ink-soft);font-size:15px;margin:2px 0 22px}
  .cards{display:flex;flex-direction:column;gap:12px;width:100%}
  .card{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 18px;
    box-shadow:0 10px 26px rgba(15,15,15,.06);transition:transform .12s ease,box-shadow .2s ease;
  }
  .card:active{transform:scale(.98)}
  .card:hover{box-shadow:0 14px 32px rgba(15,15,15,.10);transform:translateY(-2px)}
  .card .emoji{font-size:30px;line-height:1;flex:0 0 auto}
  .card .t{display:block;font-weight:800;font-size:17px;line-height:1.25}
  .card .s{display:block;color:var(--ink-mute);font-size:13px;font-weight:600;margin-top:3px}
  .card .arr{margin-left:auto;color:var(--orange);font-weight:800;font-size:20px}
  .foot{margin-top:26px;color:var(--ink-mute);font-size:12.5px;text-align:center}
  .foot a{color:var(--orange-d);text-decoration:none;font-weight:700}
</style>
</head>
<body>
  <header class="kx-top">
    <img class="kx-logo" src="assets/logo.png" alt="КУРСОР — школа программирования">
    <div class="kx-hello">Добро пожаловать! <span class="wave">👋</span></div>
  </header>

  <main class="wrap">
    <p class="lead">Школа программирования для детей 6–16 лет</p>
    <nav class="cards" id="cards">
      <a class="card" href="diagnostic/">
        <span class="emoji">🧠</span>
        <span><span class="t">Диагностика способностей</span><span class="s">Игровой тест мышления ребёнка</span></span>
        <span class="arr">→</span>
      </a>
      <a class="card" href="video/">
        <span class="emoji">🎬</span>
        <span><span class="t">Видео-презентация</span><span class="s">Короткое видео о школе</span></span>
        <span class="arr">→</span>
      </a>
      <a class="card" href="fortuna/">
        <span class="emoji">🎡</span>
        <span><span class="t">Колесо Фортуны</span><span class="s">Крутите и заберите подарок</span></span>
        <span class="arr">→</span>
      </a>
    </nav>
    <div class="foot">© KURSOR · <a href="https://kursor.school/" target="_blank" rel="noopener">kursor.school →</a></div>
  </main>

  <script>
    // Переносим параметры ссылки (?deal=…) на все страницы
    (function(){
      var qs = location.search;
      if (!qs) return;
      document.querySelectorAll('#cards a').forEach(function(a){ a.href = a.getAttribute('href') + qs; });
    })();
  </script>
</body>
</html>
