/* ============================================================
   СКЛОНЕНИЕ ИМЕНИ ПО ПАДЕЖАМ
   Учитывает русские и казахские имена. Женские имена на согласный
   (Айгерим, Айгуль, Аружан) в русском языке не склоняются.
   Род можно передать явно ("m" | "f"), иначе определяется по имени.
   ============================================================ */

/* имена, которые невозможно определить по окончанию */
const NAMES_F = new Set(["любовь", "нинель", "рахиль", "жанель", "айгуль", "гульнар", "динара", "айгерим", "аружан", "жансая", "мадина", "камила", "асель", "сауле", "алина", "амина", "дана", "инкар", "томирис", "сабина", "лейла"]);
const NAMES_M = new Set(["никита", "илья", "лука", "савва", "фома", "данила", "гаврила", "мустафа", "муса", "иса", "жеке"]);
function detectGender(name) {
  const n = name.trim().toLowerCase();
  if (NAMES_F.has(n)) return "f";
  if (NAMES_M.has(n)) return "m";
  const last = n.slice(-1);
  if (last === "а" || last === "я") return "f";
  return "m";
}

/* падежи: nom, gen (кого), dat (кому), acc (кого), ins (кем), pre (о ком) */
function declineName(name, gender) {
  const raw = (name || "").trim();
  if (!raw) return {
    nom: "",
    gen: "",
    dat: "",
    acc: "",
    ins: "",
    pre: "",
    g: "m"
  };
  const g = gender === "m" || gender === "f" ? gender : detectGender(raw);
  const last = raw.slice(-1).toLowerCase();
  const stem = raw.slice(0, -1);
  const prev = raw.slice(-2, -1).toLowerCase();
  const same = nom => ({
    nom,
    gen: nom,
    dat: nom,
    acc: nom,
    ins: nom,
    pre: nom
  });
  const G = g; /* род нужен для согласования глаголов */

  /* несклоняемые окончания */
  if ("оеиуыэю".includes(last)) return {
    ...same(raw),
    g
  };

  /* -а */
  if (last === "а") {
    /* после к г х ж ч ш щ вместо -ы пишется -и */
    const soft = "кгхжчшщ".includes(prev);
    const insEnd = "жчшщц".includes(prev) ? "ей" : "ой";
    return {
      nom: raw,
      gen: stem + (soft ? "и" : "ы"),
      dat: stem + "е",
      acc: stem + "у",
      ins: stem + insEnd,
      pre: stem + "е",
      g
    };
  }

  /* -я */
  if (last === "я") {
    const iya = prev === "и"; /* Мария, Наталия */
    return {
      nom: raw,
      gen: stem + "и",
      dat: stem + (iya ? "и" : "е"),
      acc: stem + "ю",
      ins: stem + (prev === "ь" ? "ёй" : "ей"),
      pre: stem + (iya ? "и" : "е"),
      g
    };
  }

  /* женские имена на согласный и на -ь не склоняются */
  if (g === "f") return {
    ...same(raw),
    g
  };

  /* -й  (Андрей, Сергей) */
  if (last === "й") {
    return {
      nom: raw,
      gen: stem + "я",
      dat: stem + "ю",
      acc: stem + "я",
      ins: stem + "ем",
      pre: stem + "е",
      g
    };
  }

  /* -ь  (Игорь) */
  if (last === "ь") {
    return {
      nom: raw,
      gen: stem + "я",
      dat: stem + "ю",
      acc: stem + "я",
      ins: stem + "ем",
      pre: stem + "е",
      g
    };
  }

  /* мужские на согласный: Амир, Арман, Данияр */
  const insEnd = "жчшщц".includes(last) ? "ем" : "ом";
  return {
    nom: raw,
    gen: raw + "а",
    dat: raw + "у",
    acc: raw + "а",
    ins: raw + insEnd,
    pre: raw + "е",
    g
  };
}

/* правильная форма слова «лет / года / год» */
function yearsWord(n) {
  const a = Math.abs(n) % 100,
    b = a % 10;
  if (a > 10 && a < 20) return "лет";
  if (b === 1) return "год";
  if (b >= 2 && b <= 4) return "года";
  return "лет";
}

/* ---------- ГЕНЕРАТОР ЗАДАНИЙ БЛОКА 1 ----------
   Правила фиксированы по сложности, а конкретные фигуры и цвета
   выбираются случайно при каждом прохождении. */
const SHAPES = ["circle", "square", "tri", "arrow"];
const PAL = [C.teal, C.amber, C.ink];
const rnd = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => {
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
};
const pickTwo = a => {
  const s = shuffle(a);
  return [s[0], s[1]];
};

/* каждое правило возвращает {seq, correct, distractors} */
const RULES = {
  /* ур.1 — чередование цвета */
  altColor: () => {
    const sh = rnd(SHAPES.slice(0, 3));
    const [c1, c2] = pickTwo(PAL);
    return {
      seq: [{
        shape: sh,
        fill: c1
      }, {
        shape: sh,
        fill: c2
      }, {
        shape: sh,
        fill: c1
      }],
      correct: {
        shape: sh,
        fill: c2
      },
      distractors: [{
        shape: sh,
        fill: c1
      }, {
        shape: rnd(SHAPES.filter(x => x !== sh)),
        fill: c2
      }, {
        shape: rnd(SHAPES.filter(x => x !== sh)),
        fill: c1
      }]
    };
  },
  /* ур.1 — цикл из трёх форм */
  cycleShape: () => {
    const c = rnd(PAL);
    const [a, b, d] = shuffle(SHAPES).slice(0, 3);
    return {
      seq: [{
        shape: a,
        fill: c
      }, {
        shape: b,
        fill: c
      }, {
        shape: d,
        fill: c
      }],
      correct: {
        shape: a,
        fill: c
      },
      distractors: [{
        shape: b,
        fill: c
      }, {
        shape: d,
        fill: c
      }, {
        shape: a,
        fill: rnd(PAL.filter(x => x !== c))
      }]
    };
  },
  /* ур.2 — поворот на 90° */
  rotate90: () => {
    const c = rnd(PAL);
    const start = rnd([0, 90, 180, 270]);
    const at = k => (start + k * 90) % 360;
    return {
      seq: [0, 1, 2].map(k => ({
        shape: "arrow",
        fill: c,
        rot: at(k)
      })),
      correct: {
        shape: "arrow",
        fill: c,
        rot: at(3)
      },
      distractors: [{
        shape: "arrow",
        fill: c,
        rot: at(1)
      }, {
        shape: "arrow",
        fill: c,
        rot: at(2)
      }, {
        shape: "arrow",
        fill: c,
        rot: (at(3) + 45) % 360
      }]
    };
  },
  /* ур.2 — рост количества */
  countUp: () => {
    const sh = rnd(SHAPES.slice(0, 3));
    const c = rnd(PAL);
    return {
      seq: [1, 2, 3].map(n => ({
        shape: sh,
        fill: c,
        count: n
      })),
      correct: {
        shape: sh,
        fill: c,
        count: 4
      },
      distractors: [{
        shape: sh,
        fill: c,
        count: 5
      }, {
        shape: sh,
        fill: c,
        count: 2
      }, {
        shape: sh,
        fill: rnd(PAL.filter(x => x !== c)),
        count: 4
      }]
    };
  },
  /* ур.3 — форма и цвет меняются вместе */
  altBoth: () => {
    const [s1, s2] = pickTwo(SHAPES.slice(0, 3));
    const [c1, c2] = pickTwo(PAL);
    return {
      seq: [{
        shape: s1,
        fill: c1
      }, {
        shape: s2,
        fill: c2
      }, {
        shape: s1,
        fill: c1
      }],
      correct: {
        shape: s2,
        fill: c2
      },
      distractors: [{
        shape: s1,
        fill: c2
      }, {
        shape: s2,
        fill: c1
      }, {
        shape: s1,
        fill: c1
      }]
    };
  },
  /* ур.3 — поворот + смена цвета */
  rotColor: () => {
    const sh = rnd(["tri", "arrow"]);
    const [c1, c2] = pickTwo(PAL);
    const step = rnd([60, 90]);
    return {
      seq: [0, 1, 2].map(k => ({
        shape: sh,
        fill: k % 2 === 0 ? c1 : c2,
        rot: k * step % 360
      })),
      correct: {
        shape: sh,
        fill: c2,
        rot: 3 * step % 360
      },
      distractors: [{
        shape: sh,
        fill: c1,
        rot: 3 * step % 360
      }, {
        shape: sh,
        fill: c2,
        rot: 2 * step % 360
      }, {
        shape: sh,
        fill: c2,
        rot: 4 * step % 360
      }]
    };
  },
  /* ур.4 — форма чередуется И количество растёт */
  shapeCount: () => {
    const [s1, s2] = pickTwo(SHAPES.slice(0, 3));
    const [c1, c2] = pickTwo(PAL);
    return {
      seq: [{
        shape: s1,
        fill: c1,
        count: 1
      }, {
        shape: s2,
        fill: c2,
        count: 2
      }, {
        shape: s1,

      },

      }, {
        shape: s2,
        fill: c2,
        count: 3
      }, {
        shape: s2,
        fill: c1,
        count: 4
      }]
    };
  },
  /* ур.4 — цикл трёх цветов на одной форме */
  cycleColor3: () => {
    const sh = rnd(SHAPES.slice(0, 3));
    const [a, b, c] = shuffle(PAL);
    return {
      seq: [{
        shape: sh,
        fill: a
      }, {
        shape: sh,
        fill: b
      }, {

        fill: c
      }],

        shape: sh,
        fill: a
      },

      }, {

      }, {

      }]
    };
  }
};

/* последовательность сложности: по два правила на уровень, выбирается одно */
const PATTERN_PLAN = [{
  lvl: 1,
  from: ["altColor", "cycleShape"]
}, {
  lvl: 1,
  from: ["cycleShape", "altColor"]
}, {
  lvl: 2,
  from: ["rotate90", "countUp"]
}, {
  lvl: 2,
  from: ["countUp", "rotate90"]
}, {
  lvl: 3,
  from: ["altBoth", "rotColor"]
}, {
  lvl: 3,
  from: ["rotColor", "altBoth"]
}, {
  lvl: 4,
  from: ["shapeCount", "cycleColor3"]
}];
function buildPatterns() {
  return PATTERN_PLAN.map(step => {
    const rule = RULES[rnd(step.from)]();
    const opts = shuffle([rule.correct, ...rule.distractors]);
    return {
      lvl: step.lvl,
      seq: [...rule.seq, null],
      opts,
      ans: opts.indexOf(rule.correct)
    };
  });
}

function parseGrid(g) {
  const cells = g.map(r => r.split(""));
  let start = null,
    target = null;
  cells.forEach((row, y) => row.forEach((ch, x) => {
    if (ch === "S") start = {
      x,
      y
    };
    if (ch === "T") target = {
      x,
      y
    };
  }));
  return {
    cells,
    start,
    target,
    w: cells[0].length,
    h: cells.length
  };
}
