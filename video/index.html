<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Видео-презентация · Kursor</title>
<meta name="description" content="Видео-презентация школы программирования Kursor">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/brand.css">
<style>
  .wrap{width:100%;max-width:760px;margin:0 auto;padding:6px 18px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
  h1{text-align:center;font-weight:800;line-height:1.05;font-size:clamp(24px,6.5vw,34px);letter-spacing:-.5px;margin-top:12px;max-width:100%}
  h1 .grad{background:linear-gradient(100deg,#f59e0b,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{text-align:center;color:var(--ink-soft);font-size:clamp(14px,3.8vw,16px);margin-top:8px;max-width:420px}

  .video-frame{
    width:100%;max-width:720px;margin:20px auto 0;background:#000;border-radius:20px;overflow:hidden;
    aspect-ratio:16/9;box-shadow:0 20px 45px rgba(15,15,15,.18);
  }
  .player{display:block;width:100%;height:100%;object-fit:contain;background:#000}

  .v-progress{width:100%;max-width:720px;height:8px;border-radius:100px;background:#eee;overflow:hidden;margin:14px auto 0}
  .v-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--orange));transition:width .3s ease}
  .v-status{margin-top:8px;color:var(--ink-mute);font-size:13px;font-weight:600}

  .done-card{
    width:100%;max-width:520px;margin:20px auto 0;text-align:center;background:#fffdf5;
    border:1.5px dashed rgba(245,158,11,.55);border-radius:22px;padding:24px 22px;box-shadow:0 16px 36px rgba(15,15,15,.10);
  }
  .done-emoji{font-size:48px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 6px 14px rgba(34,197,94,.3))}
  .done-title{font-weight:800;font-size:20px;margin-bottom:12px}
  .done-sub{color:var(--ink-soft);font-size:14.5px;margin-top:8px}
  .mk-info{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .mk-row{font-size:14.5px;color:var(--ink);background:#fff7e6;border:1px solid rgba(245,158,11,.3);border-radius:12px;padding:9px 12px}
  .mk-row b{font-weight:800}

  .watched-btn{margin-top:16px;max-width:520px;width:100%}
</style>
</head>
<body>

  <header class="kx-top">
    <img class="kx-logo" src="../assets/logo.png" alt="КУРСОР — школа программирования">
    <div class="kx-hello" data-kx-greeting>Здравствуйте! 👋</div>
  </header>

  <main class="wrap">
    <h1>Видео-презентация <span class="grad">KURSOR</span></h1>
    <p class="lead">Посмотрите короткое видео — а после ждём вас на мастер-классе 👋</p>

    <div class="video-frame">
      <video id="player" class="player" controls controlsList="nodownload" oncontextmenu="return false" playsinline preload="metadata">
        <source id="videoSrc" src="https://pub-b883488408014edc847550ef886303bf.r2.dev/nurmashvideo.mp4" type="video/mp4">
        Ваш браузер не поддерживает встроенное видео.
      </video>
    </div>

    <div class="v-progress" aria-hidden="true"><div class="v-bar" id="bar"></div></div>
    <div class="v-status" id="status">Просмотрено: 0%</div>

    <div class="done-card" id="doneCard" hidden>
      <div class="done-emoji">✅</div>
      <div class="done-title">Спасибо, что посмотрели!</div>
      <div class="mk-info">
        <div class="mk-row" data-kx-needs-mk hidden>🗓 Мастер-класс: <b data-kx-mk></b></div>
        <div class="mk-row" data-kx-needs-child hidden>🧒 Ученик: <b data-kx-child></b></div>
      </div>
      <div class="done-sub">Ждём вас на мастер-классе — живое знакомство со школой 👋</div>
    </div>

    <button class="kx-btn ghost watched-btn" id="watchedBtn">Я досмотрел ✅</button>
  </main>

  <script src="../assets/kursor.js"></script>
  <script>
  (function(){
    "use strict";
    // Если видео на другом хостинге — поменяйте src здесь (или тег <source> выше).
    var VIDEO_SRC = "https://pub-b883488408014edc847550ef886303bf.r2.dev/nurmashvideo.mp4";

    var player = document.getElementById('player');
    var bar = document.getElementById('bar');
    var status = document.getElementById('status');
    var doneCard = document.getElementById('doneCard');
    var watchedBtn = document.getElementById('watchedBtn');
    var srcEl = document.getElementById('videoSrc');
    if (srcEl && srcEl.getAttribute('src') !== VIDEO_SRC) { srcEl.src = VIDEO_SRC; player.load(); }

    var WATCH_THRESHOLD = 0.7;   // считаем «посмотрел» при 70% досмотра
    var maxPct = 0, tagged = false;

    function markWatched(){
      if (tagged) return;
      tagged = true;
      if (window.KX && KX.tag) KX.tag('video');   // ставим тег на сделку
      if (window.KX && KX.render) KX.render();
      doneCard.hidden = false;
      watchedBtn.hidden = true;
      try{ doneCard.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){}
    }

    player.addEventListener('timeupdate', function(){
      if (!player.duration || isNaN(player.duration)) return;
      var pct = player.currentTime / player.duration;
      if (pct > maxPct) maxPct = pct;
      var shown = Math.round(maxPct * 100);
      bar.style.width = shown + '%';
      status.textContent = 'Просмотрено: ' + shown + '%';
      if (maxPct >= WATCH_THRESHOLD) markWatched();
    });
    player.addEventListener('ended', function(){ maxPct = 1; bar.style.width='100%'; status.textContent='Просмотрено: 100%'; markWatched(); });

    // Ручная подстраховка (и вариант для случаев, когда авто-трекинг не сработал)
    watchedBtn.addEventListener('click', markWatched);
  })();
  </script>
</body>
</html>
